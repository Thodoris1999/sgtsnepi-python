name: Build Wheels (Linux + macOS)
on:
  push:
    branches: [ "pybind", "windows_ci" ]
  pull_request:
    branches: [ "pybind" ]
jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Use vcpkg GitHub Action to install fftw3 for windows
      #- name: Set up vcpkg
      #  if: matrix.os == 'windows-latest'
      #  uses: lukka/run-vcpkg@v11
      #  with:
      #    vcpkgDirectory: '${{ github.workspace }}/vcpkg'
      #    vcpkgTriplet: 'x64-windows'
      #    vcpkgArguments: 'fftw3'

      # Download and extract fftw3.zip for Windows
      - name: Download fftw3.zip
        if: matrix.os == 'windows-latest'
        run: |
          $url = "https://fftw.org/pub/fftw/fftw-3.3.5-dll64.zip"
          $output = "$env:RUNNER_TEMP\fftw3.zip"
          Invoke-WebRequest -Uri $url -OutFile $output

      - name: Extract fftw3.zip
        if: matrix.os == 'windows-latest'
        run: |
          $zipPath = "$env:RUNNER_TEMP\fftw3.zip"
          $extractPath = "$env:RUNNER_TEMP\fftw3"
          Expand-Archive -Path $zipPath -DestinationPath $extractPath

      - name: Set FFTW3 environment variables
        if: matrix.os == 'windows-latest'
        run: |
          $extractPath = "$env:RUNNER_TEMP\fftw3"
          $includePath = "$extractPath"
          $libPath = "$extractPath"
          echo "FFTW3_INCLUDE_PATH=$includePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "FFTW3_LIB_PATH=$libPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ------------------------------------------
      # Build Wheels Using cibuildwheel
      # ------------------------------------------
      - name: Build Wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_BEFORE_BUILD_MACOS: "brew update && brew install fftw"
          CIBW_BEFORE_BUILD_LINUX: "yum install -y fftw-devel"

          # Only build 64-bit manylinux wheels, skip musllinux
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_SKIP: "*-win32 *-musllinux_*"

          # Force a valid manylinux image (avoid date-based tags)
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux2014_x86_64:latest"

          # Force the wheel's minimum macOS version to 14.0
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        with:
          output-dir: dist

      - name: Show built wheels
        run: ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          # We'll name each artifact distinctly, so we can download them all later
          name: dist-${{ matrix.os }}
          path: dist/*.whl

